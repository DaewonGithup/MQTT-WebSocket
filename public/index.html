<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>로컬 MQTT 공유</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 640px; margin: 0 auto; padding: 16px; }
  #host { background: #eef6ff; padding: 12px; border-radius: 8px; margin-bottom: 16px; }
  #log { border: 1px solid #ccc; border-radius: 8px; height: 50vh; overflow-y: auto; padding: 8px; margin: 12px 0; }
  .me { text-align: right; color: #0550ae; }
  .sys { color: #666; font-style: italic; }
  input, button { font-size: 1rem; padding: 8px; }
  form { display: flex; gap: 8px; }
  form input { flex: 1; }
</style>
</head>
<body>
<h1>로컬 MQTT 공유</h1>

<section id="host" hidden>
  <strong>호스트</strong><br>
  토픽: <code id="host-topic"></code><br>
  PIN: <code id="host-pin"></code><br>
  <div id="host-joins"></div>
  <button id="end">세션 종료 (전체 삭제)</button>
</section>

<form id="join">
  <label for="topic">토픽</label>
  <input id="topic" placeholder="호스트가 알려준 토픽" required autocomplete="off">
  <label for="pin">PIN</label>
  <input id="pin" placeholder="6자리 숫자" required autocomplete="off" inputmode="numeric" pattern="\d{6}" maxlength="6">
  <button>입장</button>
</form>

<div id="chat" hidden>
  <div id="log" aria-live="polite"></div>
  <form id="send">
    <label for="msg" hidden>메시지</label>
    <input id="msg" placeholder="메시지 입력" required autocomplete="off">
    <button>보내기</button>
  </form>
  <form id="upload">
    <label for="file" hidden>파일</label>
    <input id="file" type="file" required accept=".png,.jpg,.jpeg,.gif,.webp,.pdf,.txt,.zip,.docx,.xlsx,.pptx,.hwp">
    <button>파일 보내기</button>
  </form>
  <progress id="progress" max="1" value="0" hidden></progress>
</div>

<p id="closed" role="status" hidden>세션이 종료되어 모든 내용이 삭제되었습니다.</p>

<script src="/mqtt.min.js"></script>
<script>
const $ = (id) => document.getElementById(id)
const me = Math.random().toString(36).slice(2)
let client, topic, pin

// QR로 들어오면 주소 끝(#t=토픽)에서 토픽을 미리 채움
const fromQr = new URLSearchParams(location.hash.slice(1)).get('t')
if (fromQr) $('topic').value = fromQr

function add (text, cls) {
  const p = document.createElement('p')
  p.textContent = text
  if (cls) p.className = cls
  $('log').append(p)
  $('log').scrollTop = $('log').scrollHeight
}

// 이 PC에서 열었을 때만 호스트 정보가 옴
fetch('/host').then((r) => r.ok && r.json()).then((h) => {
  if (!h) return
  $('host').hidden = false
  $('host-topic').textContent = h.topic
  $('host-pin').textContent = h.pin
  if (!h.joins.length) $('host-joins').textContent = '접속 주소 없음 (네트워크 연결을 확인하세요)'
  for (const j of h.joins) {
    const fig = document.createElement('figure')
    fig.innerHTML = j.qr // 우리 서버가 만든 SVG
    const cap = document.createElement('figcaption')
    cap.textContent = j.url.split('/#')[0]
    fig.append(cap)
    $('host-joins').append(fig)
  }
  $('topic').value = h.topic
  $('pin').value = h.pin
}).catch(() => {})

// 호스트·참여자 모두 같은 종료 화면으로 바꿈 (두 번 불려도 한 번만)
function sessionClosed () {
  if (!$('closed').hidden) return
  $('log').replaceChildren()
  for (const id of ['host', 'join', 'chat']) $(id).hidden = true
  $('closed').hidden = false
  client?.end()
}

$('end').onclick = () => {
  if (!confirm('세션을 끝내고 모든 메시지를 지울까요?')) return
  // 호스트가 입장하지 않았으면 MQTT 종료 알림을 못 받으므로 응답으로 바로 화면을 바꿈
  fetch('/host', { method: 'POST' })
    .then((r) => r.ok ? sessionClosed() : alert('세션 종료에 실패했습니다.'))
    .catch(() => alert('서버에 연결할 수 없습니다. 이미 종료되었을 수 있습니다.'))
}

$('join').onsubmit = (e) => {
  e.preventDefault()
  topic = $('topic').value.trim()
  pin = $('pin').value.trim()
  client = mqtt.connect(`ws://${location.host}/mqtt`, { reconnectPeriod: 0, username: 'guest', password: pin })
  // PIN이 틀리거나 잠기면 브로커가 연결을 거부함
  client.on('error', () => {
    alert('PIN이 맞지 않습니다. 5번 틀리면 1분 동안 입장할 수 없습니다.')
    client.end()
  })
  client.on('connect', () => {
    client.subscribe(topic, (err, granted) => {
      // 토픽이 틀리면 브로커가 거부(qos 128)
      if (err || granted[0].qos === 128) {
        alert('토픽이 맞지 않습니다.')
        return client.end()
      }
      $('join').hidden = true
      $('chat').hidden = false
      add('입장했습니다.', 'sys')
    })
  })
  client.on('message', (_, payload) => {
    let m
    try { m = JSON.parse(payload) } catch { return }
    if (m.type === 'session-closed') {
      sessionClosed()
    } else if (m.type === 'text' && typeof m.text === 'string') {
      add(m.text, m.from === me ? 'me' : '')
    } else if (m.type === 'file' && /^[0-9a-f]{32}$/.test(m.id)) {
      // 주소는 id로만 만듦: 남이 보낸 가짜 링크(외부 주소 등)를 막기 위해
      const p = document.createElement('p')
      p.id = 'f-' + m.id
      const a = document.createElement('a')
      a.href = '/files/' + m.id
      a.download = ''
      a.textContent = `📎 ${m.name} (${(m.size / 1024).toFixed(1)} KB)`
      p.append(a)
      $('log').append(p)
      $('log').scrollTop = $('log').scrollHeight
    } else if (m.type === 'file-removed') {
      const p = document.getElementById('f-' + m.id)
      if (p) p.textContent = p.textContent + ' (만료되어 삭제됨)'
    }
  })
  client.on('close', () => { if (!$('chat').hidden) add('연결이 끊어졌습니다.', 'sys') })
}

$('send').onsubmit = (e) => {
  e.preventDefault()
  client.publish(topic, JSON.stringify({ type: 'text', from: me, text: $('msg').value }))
  $('msg').value = ''
}

// fetch는 업로드 진행률을 못 줘서 XMLHttpRequest 사용
$('upload').onsubmit = (e) => {
  e.preventDefault()
  const file = $('file').files[0]
  const xhr = new XMLHttpRequest()
  xhr.open('POST', '/files')
  xhr.setRequestHeader('X-Topic', topic)
  xhr.setRequestHeader('X-Pin', pin)
  xhr.setRequestHeader('X-Filename', encodeURIComponent(file.name))
  $('progress').hidden = false
  xhr.upload.onprogress = (ev) => { if (ev.lengthComputable) $('progress').value = ev.loaded / ev.total }
  xhr.onloadend = () => {
    $('progress').hidden = true
    $('progress').value = 0
    if (xhr.status === 200) $('file').value = ''
    else add(`파일 전송 실패: ${xhr.responseText || '연결 오류'}`, 'sys')
  }
  xhr.send(file)
}
</script>
</body>
</html>
