<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>로컬 MQTT 공유</title>
<style>
  :root {
    --bg: #f4f6fb; --card: #ffffff; --text: #1d2433; --muted: #6b7385; --line: #e2e6ef;
    --primary: #3b5bdb; --primary-text: #ffffff; --bubble: #eef1f7; --danger: #e03131;
    --shadow: 0 4px 16px rgba(20, 30, 60, .08);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #11141b; --card: #1a1f29; --text: #e6e9f0; --muted: #8d95a8; --line: #2b3240;
      --primary: #5c7cfa; --bubble: #252c39; --danger: #ff6b6b; --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: system-ui, "Malgun Gothic", sans-serif; line-height: 1.5; }
  main { max-width: 680px; margin: 0 auto; padding: 24px 16px 40px; }
  header { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
  header .logo { width: 40px; height: 40px; border-radius: 12px; background: var(--primary); color: var(--primary-text); display: grid; place-items: center; font-size: 20px; }
  header h1 { margin: 0; font-size: 1.35rem; }
  header p { margin: 0; color: var(--muted); font-size: .9rem; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 20px; box-shadow: var(--shadow); margin-bottom: 16px; }
  .card h2 { margin: 0 0 12px; font-size: 1.05rem; }
  .badge { display: inline-block; font-size: .75rem; padding: 2px 8px; border-radius: 999px; background: var(--primary); color: var(--primary-text); margin-left: 6px; vertical-align: middle; }
  .info { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; margin: 0 0 16px; }
  .info dt { color: var(--muted); }
  .info dd { margin: 0; font-family: ui-monospace, Consolas, monospace; word-break: break-all; }
  #host-pin { font-size: 1.6rem; letter-spacing: .3em; font-weight: 700; color: var(--primary); }
  #host-joins { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 16px; }
  #host-joins figure { margin: 0; text-align: center; }
  /* QR은 어두운 화면에서도 잘 찍히게 흰 바탕 유지 */
  #host-joins svg { width: 160px; height: 160px; background: #fff; border-radius: 12px; padding: 8px; display: block; }
  #host-joins figcaption { font-size: .8rem; color: var(--muted); margin-top: 6px; font-family: ui-monospace, Consolas, monospace; }
  label { display: block; font-size: .85rem; color: var(--muted); margin: 0 0 4px; }
  .field { margin-bottom: 12px; }
  input { width: 100%; font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
  input:focus-visible, button:focus-visible { outline: 3px solid color-mix(in srgb, var(--primary) 45%, transparent); outline-offset: 1px; }
  #pin { font-family: ui-monospace, Consolas, monospace; letter-spacing: .3em; }
  button { font: inherit; font-weight: 600; border: 0; border-radius: 10px; padding: 10px 16px; cursor: pointer; background: var(--primary); color: var(--primary-text); white-space: nowrap; }
  button:hover { filter: brightness(1.08); }
  button.danger { background: transparent; color: var(--danger); border: 1px solid var(--danger); }
  #join button { width: 100%; }
  .row { display: flex; gap: 8px; margin-top: 10px; }
  .row input { flex: 1; min-width: 0; }
  #log { height: 50vh; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding: 4px; }
  .msg { margin: 0; max-width: 80%; padding: 8px 12px; border-radius: 14px 14px 14px 4px; background: var(--bubble); align-self: flex-start; word-break: break-word; }
  .msg.me { align-self: flex-end; background: var(--primary); color: var(--primary-text); border-radius: 14px 14px 4px 14px; }
  .msg.me a { color: inherit; }
  .msg.sys { align-self: center; background: none; color: var(--muted); font-size: .85rem; padding: 0; }
  .msg a { color: var(--primary); font-weight: 600; }
  progress { width: 100%; height: 8px; margin-top: 10px; accent-color: var(--primary); }
  #closed { text-align: center; color: var(--muted); }
  @media (max-width: 480px) { .row { flex-wrap: wrap; } .row button { flex: 1; } }
</style>
</head>
<body>
<main>
<header>
  <div class="logo" aria-hidden="true">💬</div>
  <div>
    <h1>로컬 MQTT 공유</h1>
    <p>같은 와이파이에서 메시지와 파일을 주고받고, 끝나면 모두 지웁니다.</p>
  </div>
</header>

<section id="host" class="card" hidden>
  <h2>호스트 <span class="badge">이 PC</span></h2>
  <dl class="info">
    <dt>토픽</dt><dd id="host-topic"></dd>
    <dt>PIN</dt><dd id="host-pin"></dd>
  </dl>
  <div id="host-joins"></div>
  <button id="end" class="danger">세션 종료 (전체 삭제)</button>
</section>

<form id="join" class="card">
  <h2>입장하기</h2>
  <div class="field">
    <label for="topic">토픽</label>
    <input id="topic" placeholder="호스트가 알려준 토픽" required autocomplete="off">
  </div>
  <div class="field">
    <label for="pin">PIN</label>
    <input id="pin" placeholder="6자리 숫자" required autocomplete="off" inputmode="numeric" pattern="\d{6}" maxlength="6">
  </div>
  <button>입장</button>
</form>

<section id="chat" class="card" hidden>
  <div id="log" aria-live="polite"></div>
  <form id="send" class="row">
    <label for="msg" hidden>메시지</label>
    <input id="msg" placeholder="메시지 입력" required autocomplete="off">
    <button>보내기</button>
  </form>
  <form id="upload" class="row">
    <label for="file" hidden>파일</label>
    <input id="file" type="file" required accept=".png,.jpg,.jpeg,.gif,.webp,.pdf,.txt,.zip,.docx,.xlsx,.pptx,.hwp">
    <button>파일 보내기</button>
  </form>
  <progress id="progress" max="1" value="0" hidden></progress>
</section>

<p id="closed" class="card" role="status" hidden>세션이 종료되어 모든 내용이 삭제되었습니다.</p>
</main>

<script src="/mqtt.min.js"></script>
<script>
const $ = (id) => document.getElementById(id)
const me = Math.random().toString(36).slice(2)
let client, topic, pin

// QR로 들어오면 주소 끝(#t=토픽)에서 토픽을 미리 채움
const fromQr = new URLSearchParams(location.hash.slice(1)).get('t')
if (fromQr) $('topic').value = fromQr

function add (text, cls) {
  const p = document.createElement('p')
  p.textContent = text
  p.className = 'msg ' + (cls || '')
  $('log').append(p)
  $('log').scrollTop = $('log').scrollHeight
}

// 이 PC에서 열었을 때만 호스트 정보가 옴
fetch('/host').then((r) => r.ok && r.json()).then((h) => {
  if (!h) return
  $('host').hidden = false
  $('host-topic').textContent = h.topic
  $('host-pin').textContent = h.pin
  if (!h.joins.length) $('host-joins').textContent = '접속 주소 없음 (네트워크 연결을 확인하세요)'
  for (const j of h.joins) {
    const fig = document.createElement('figure')
    fig.innerHTML = j.qr // 우리 서버가 만든 SVG
    const cap = document.createElement('figcaption')
    cap.textContent = j.url.split('/#')[0]
    fig.append(cap)
    $('host-joins').append(fig)
  }
  $('topic').value = h.topic
  $('pin').value = h.pin
}).catch(() => {})

// 호스트·참여자 모두 같은 종료 화면으로 바꿈 (두 번 불려도 한 번만)
function sessionClosed () {
  if (!$('closed').hidden) return
  $('log').replaceChildren()
  for (const id of ['host', 'join', 'chat']) $(id).hidden = true
  $('closed').hidden = false
  client?.end()
}

$('end').onclick = () => {
  if (!confirm('세션을 끝내고 모든 메시지를 지울까요?')) return
  // 호스트가 입장하지 않았으면 MQTT 종료 알림을 못 받으므로 응답으로 바로 화면을 바꿈
  fetch('/host', { method: 'POST' })
    .then((r) => r.ok ? sessionClosed() : alert('세션 종료에 실패했습니다.'))
    .catch(() => alert('서버에 연결할 수 없습니다. 이미 종료되었을 수 있습니다.'))
}

$('join').onsubmit = (e) => {
  e.preventDefault()
  topic = $('topic').value.trim()
  pin = $('pin').value.trim()
  client = mqtt.connect(`ws://${location.host}/mqtt`, { reconnectPeriod: 0, username: 'guest', password: pin })
  // PIN이 틀리거나 잠기면 브로커가 연결을 거부함
  client.on('error', () => {
    alert('PIN이 맞지 않습니다. 5번 틀리면 1분 동안 입장할 수 없습니다.')
    client.end()
  })
  client.on('connect', () => {
    client.subscribe(topic, (err, granted) => {
      // 토픽이 틀리면 브로커가 거부(qos 128)
      if (err || granted[0].qos === 128) {
        alert('토픽이 맞지 않습니다.')
        return client.end()
      }
      $('join').hidden = true
      $('chat').hidden = false
      add('입장했습니다.', 'sys')
    })
  })
  client.on('message', (_, payload) => {
    let m
    try { m = JSON.parse(payload) } catch { return }
    if (m.type === 'session-closed') {
      sessionClosed()
    } else if (m.type === 'text' && typeof m.text === 'string') {
      add(m.text, m.from === me ? 'me' : '')
    } else if (m.type === 'file' && /^[0-9a-f]{32}$/.test(m.id)) {
      // 주소는 id로만 만듦: 남이 보낸 가짜 링크(외부 주소 등)를 막기 위해
      const p = document.createElement('p')
      p.id = 'f-' + m.id
      p.className = 'msg'
      const a = document.createElement('a')
      a.href = '/files/' + m.id
      a.download = ''
      a.textContent = `📎 ${m.name} (${(m.size / 1024).toFixed(1)} KB)`
      p.append(a)
      $('log').append(p)
      $('log').scrollTop = $('log').scrollHeight
    } else if (m.type === 'file-removed') {
      const p = document.getElementById('f-' + m.id)
      if (p) p.textContent = p.textContent + ' (만료되어 삭제됨)'
    }
  })
  client.on('close', () => { if (!$('chat').hidden) add('연결이 끊어졌습니다.', 'sys') })
}

$('send').onsubmit = (e) => {
  e.preventDefault()
  client.publish(topic, JSON.stringify({ type: 'text', from: me, text: $('msg').value }))
  $('msg').value = ''
}

// fetch는 업로드 진행률을 못 줘서 XMLHttpRequest 사용
$('upload').onsubmit = (e) => {
  e.preventDefault()
  const file = $('file').files[0]
  const xhr = new XMLHttpRequest()
  xhr.open('POST', '/files')
  xhr.setRequestHeader('X-Topic', topic)
  xhr.setRequestHeader('X-Pin', pin)
  xhr.setRequestHeader('X-Filename', encodeURIComponent(file.name))
  $('progress').hidden = false
  xhr.upload.onprogress = (ev) => { if (ev.lengthComputable) $('progress').value = ev.loaded / ev.total }
  xhr.onloadend = () => {
    $('progress').hidden = true
    $('progress').value = 0
    if (xhr.status === 200) $('file').value = ''
    else add(`파일 전송 실패: ${xhr.responseText || '연결 오류'}`, 'sys')
  }
  xhr.send(file)
}
</script>
</body>
</html>
